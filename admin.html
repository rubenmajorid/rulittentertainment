<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | R.U.LITT Entertainment</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--card:#121212;--line:rgba(255,255,255,.1);--text:#f5f5f5;--muted:#9a9a9a;--red:#d0021b;--ok:#3ddc84;--warn:#ffb020}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
h1,h2{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.03em}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:14px;text-align:center}
.login h1{font-size:2.4rem}
.in{width:100%;background:#0a0a0a;border:1px solid var(--line);border-radius:12px;padding:.75em .9em}
.in:focus{outline:none;border-color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:.65em 1.1em;border-radius:999px;font-weight:700;background:#fff;color:#000;white-space:nowrap}
.btn.sm{padding:.4em .8em;font-size:.8rem}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#000}
.err{color:#ff7d93;font-size:.85rem;min-height:1.2em}
/* layout */
header{position:sticky;top:0;z-index:5;background:rgba(6,6,6,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.top h1{font-size:1.7rem;line-height:1}
.top small{display:block;font-family:Inter;font-size:.65rem;letter-spacing:.3em;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.tab{padding:.5em 1em;border-radius:999px;border:1px solid var(--line);color:#cfcfcf;white-space:nowrap}
.tab.on{background:#fff;color:#000;border-color:#fff}
main{padding:22px 0 60px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi b{display:block;font-family:"Bebas Neue";font-size:2.4rem;font-weight:400;line-height:1}
.kpi span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:.78rem;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h2{font-size:1.5rem;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:#fff;border-radius:6px 6px 0 0;min-height:2px}
.bar small{font-size:.65rem;color:var(--muted)}
.bar b{font-size:.7rem;font-weight:600}
.list{list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .in{max-width:280px}
.tools select.in{max-width:180px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
td small{color:var(--muted)}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:.2em .7em;border-radius:999px;font-size:.72rem;font-weight:700}
.pill.Pending{background:rgba(255,176,32,.15);color:var(--warn)}
.pill.Paid{background:rgba(61,220,132,.15);color:var(--ok)}
.pill.Cancelled{background:rgba(255,125,147,.15);color:#ff7d93}
.pill.in{background:#fff;color:#000}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.guests{font-size:.8rem;color:#cfcfcf;max-width:260px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.q{background:#0a0a0a;border:1px solid var(--line);border-radius:14px;padding:14px}
.q h3{font-size:1rem;margin-bottom:4px}
.q p{color:#cfcfcf;font-size:.85rem}
.setup{max-width:640px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.setup h2{font-size:2rem;margin-bottom:8px}.setup p,.setup li{color:#cfcfcf;margin-bottom:8px}.setup ol{padding-left:20px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.cards{grid-template-columns:1fr}}
.mail{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:6px;margin-bottom:12px;font-size:.82rem;color:#cfcfcf;font-weight:600}
textarea.in{min-height:140px;resize:vertical}
.preview{background:#000;border-radius:14px;padding:16px;max-height:720px;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.82rem}
@media (max-width:860px){.mail{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <h1>R.U.LITT Admin</h1>
    <p style="color:var(--muted)">Panel de visitas, suscriptores y entradas</p>
    <input class="in" type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn red" type="submit">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="top">
        <h1>R.U.LITT <small>ADMIN</small></h1>
        <div style="display:flex;gap:8px">
          <button class="btn sm ghost" id="refresh">↻ Actualizar</button>
          <button class="btn sm ghost" id="logout">Salir</button>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab on" data-t="dash">Resumen</button>
        <button class="tab" data-t="tickets">Entradas</button>
        <button class="tab" data-t="door">Lista de puerta</button>
        <button class="tab" data-t="subs">Suscriptores</button>
        <button class="tab" data-t="mail">📣 Email marketing</button>
        <button class="tab" data-t="quotes">Cotizaciones</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<script>
/* Same URL as CONFIG.dataEndpoint in script.js (Google Apps Script web app, ends in /exec) */
const API = "https://script.google.com/macros/s/AKfycbymvvL6luztOMd3b6jRBZc6HQiJizkM_wfEOBRGtlhYMPuXFYOVdI9cMb_YR_8_tuQX/exec";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 });
const fmt = (d) => d ? new Date(d).toLocaleString("es", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
let KEY = "", DATA = null, TAB = "dash";
try { KEY = sessionStorage.getItem("rulitt-admin") || ""; } catch (e) {}

if (!API) {
  $("#loginForm").hidden = true;
  $("#login").insertAdjacentHTML("beforeend", `<div class="setup"><h2>Falta conectar el panel</h2>
    <p>El panel lee los datos de una hoja de Google de R.U.LITT. Para activarlo:</p>
    <ol><li>Seguir los pasos de <b>rulitt-backend/Code.gs</b> con la cuenta r.u.littentertainment@gmail.com.</li>
    <li>Pegar la URL de la Web App (termina en <b>/exec</b>) en <b>admin.html</b> (const API) y en <b>script.js</b> (CONFIG.dataEndpoint).</li></ol></div>`);
}

async function load() {
  const r = await fetch(`${API}?key=${encodeURIComponent(KEY)}&t=${Date.now()}`);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "error");
  DATA = j; return j;
}
async function act(params) {
  const q = new URLSearchParams({ key: KEY, action: "update", ...params });
  const j = await (await fetch(`${API}?${q}`)).json();
  if (!j.ok) alert("No se pudo actualizar"); await load(); render();
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); KEY = $("#pw").value; $("#loginErr").textContent = "Entrando…";
  try { await load(); try { sessionStorage.setItem("rulitt-admin", KEY); } catch (e) {} start(); }
  catch (err) { $("#loginErr").textContent = err.message === "unauthorized" ? "Contraseña incorrecta" : "No se pudo conectar"; }
});
$("#logout").onclick = () => { try { sessionStorage.removeItem("rulitt-admin"); } catch (e) {} location.reload(); };
$("#refresh").onclick = async () => { $("#refresh").textContent = "…"; await load(); render(); $("#refresh").textContent = "↻ Actualizar"; };
$("#tabs").onclick = (e) => { const b = e.target.closest(".tab"); if (!b) return; TAB = b.dataset.t;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b)); render(); };

function start() { $("#login").hidden = true; $("#app").hidden = false; render(); }
if (API && KEY) load().then(start).catch(() => {});

function csv(rows, name) {
  if (!rows.length) return;
  const h = Object.keys(rows[0]);
  const out = [h.join(",")].concat(rows.map((r) => h.map((k) => `"${String(r[k] ?? "").replace(/"/g, '""')}"`).join(","))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + out], { type: "text/csv" })); a.download = name; a.click();
}

function render() {
  const v = $("#view"), { tickets = [], subscribers = [], quotes = [], visits = [] } = DATA || {};
  const day = (d) => new Date(d).toISOString().slice(0, 10), now = Date.now();
  const since = (days) => visits.filter((x) => now - new Date(x.created) < days * 864e5).length;
  const valid = tickets.filter((t) => t.status !== "Cancelled");
  const paid = valid.filter((t) => t.status === "Paid");
  const people = (arr) => arr.reduce((s, t) => s + (String(t.ticket_type).includes("VIP") ? 4 : 1) * Number(t.qty || 1), 0);

  if (TAB === "dash") {
    const days = [...Array(14)].map((_, i) => day(now - (13 - i) * 864e5));
    const counts = days.map((d) => visits.filter((x) => day(x.created) === d).length), max = Math.max(1, ...counts);
    const pages = {}; visits.forEach((x) => (pages[x.page] = (pages[x.page] || 0) + 1));
    const refs = {}; visits.forEach((x) => (refs[x.referrer] = (refs[x.referrer] || 0) + 1));
    const top = (o) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, n]) => `<li><span>${esc(k)}</span><b>${n}</b></li>`).join("") || '<li class="empty">Sin datos todavía</li>';
    v.innerHTML = `
      <div class="kpis">
        <div class="kpi"><span>Visitas hoy</span><b>${visits.filter((x) => day(x.created) === day(now)).length}</b><em>7 días: ${since(7)} · 30 días: ${since(30)}</em></div>
        <div class="kpi"><span>Suscriptores</span><b>${subscribers.length}</b><em>Nuevos esta semana: ${subscribers.filter((x) => now - new Date(x.created) < 7 * 864e5).length}</em></div>
        <div class="kpi"><span>Entradas (personas)</span><b>${people(valid)}</b><em>${valid.length} compras · ${people(paid)} pagadas</em></div>
        <div class="kpi"><span>Ventas</span><b>${money(paid.reduce((s, t) => s + Number(t.total), 0))}</b><em>Pendiente: ${money(valid.filter((t) => t.status === "Pending").reduce((s, t) => s + Number(t.total), 0))}</em></div>
      </div>
      <div class="grid2">
        <div class="panel"><h2>Visitas · últimos 14 días</h2><div class="bars">${counts.map((c, i) => `<div class="bar"><b>${c || ""}</b><i style="height:${(c / max) * 100}%"></i><small>${days[i].slice(8)}</small></div>`).join("")}</div></div>
        <div class="panel"><h2>Páginas más vistas</h2><ul class="list">${top(pages)}</ul></div>
      </div>
      <div class="grid2">
        <div class="panel"><h2>Últimas compras</h2><ul class="list">${tickets.slice(-6).reverse().map((t) => `<li><span>${esc(t.name)} · ${t.qty} ${esc(t.ticket_type)}</span><span class="pill ${esc(t.status)}">${esc(t.status)}</span></li>`).join("") || '<li class="empty">Sin compras todavía</li>'}</ul></div>
        <div class="panel"><h2>De dónde llegan</h2><ul class="list">${top(refs)}</ul></div>
      </div>`;
  }

  if (TAB === "tickets") {
    v.innerHTML = `<div class="panel"><h2>Entradas</h2>
      <div class="tools"><input class="in" id="q" placeholder="Buscar nombre, correo o código">
        <select class="in" id="st"><option value="">Todos</option><option>Pending</option><option>Paid</option><option>Cancelled</option></select>
        <button class="btn sm ghost" id="exp">Exportar CSV</button></div>
      <p style="color:var(--muted);margin-bottom:10px">Compara cada compra con Venmo (@REntertainment100): la nota del pago trae el mismo código. Marca "Pagado" cuando llegue.</p>
      <div class="tbl"><table><thead><tr><th>Código / fecha</th><th>Comprador</th><th>Entrada</th><th>Total</th><th>Reserva</th><th>Estado</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
    const draw = () => {
      const q = $("#q").value.toLowerCase(), st = $("#st").value;
      const rows = tickets.filter((t) => (!st || t.status === st) && JSON.stringify(t).toLowerCase().includes(q)).reverse();
      $("#tb").innerHTML = rows.map((t) => `<tr>
        <td><b>${esc(t.code)}</b><br><small>${fmt(t.created)}</small></td>
        <td>${esc(t.name)}<br><small>${esc(t.email)}<br>${esc(t.phone)}</small></td>
        <td>${t.qty} × ${esc(t.ticket_type)}</td><td>${money(t.total)}</td>
        <td class="guests">${esc(t.guests)}</td>
        <td><span class="pill ${esc(t.status)}">${esc(t.status)}</span>${t.checked_in ? '<br><span class="pill in">Entró</span>' : ""}</td>
        <td><div class="acts">
          ${t.status !== "Paid" ? `<button class="btn sm ok" data-a="paid" data-c="${esc(t.code)}">Pagado</button>` : `<button class="btn sm ghost" data-a="pending" data-c="${esc(t.code)}">Pendiente</button>`}
          ${t.status !== "Cancelled" ? `<button class="btn sm ghost" data-a="cancel" data-c="${esc(t.code)}">Cancelar</button>` : ""}
        </div></td></tr>`).join("") || '<tr><td colspan="7" class="empty">Sin compras</td></tr>';
    };
    $("#q").oninput = draw; $("#st").onchange = draw; $("#exp").onclick = () => csv(tickets, "rulitt-entradas.csv"); draw();
    $("#tb").onclick = (e) => { const b = e.target.closest("[data-a]"); if (!b) return; b.textContent = "…";
      act({ code: b.dataset.c, status: { paid: "Paid", pending: "Pending", cancel: "Cancelled" }[b.dataset.a] }); };
  }

  if (TAB === "door") {
    v.innerHTML = `<div class="panel"><h2>Lista de puerta</h2>
      <div class="tools"><input class="in" id="q" placeholder="Buscar nombre o código" autofocus>
        <label style="display:flex;gap:6px;align-items:center;color:#cfcfcf"><input type="checkbox" id="onlyPaid" checked> Solo pagadas</label></div>
      <div class="tbl"><table><thead><tr><th>Código</th><th>Reserva a nombre de</th><th>Entrada</th><th>Estado</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`;
    const draw = () => {
      const q = $("#q").value.toLowerCase(), op = $("#onlyPaid").checked;
      const rows = valid.filter((t) => (!op || t.status === "Paid") && (t.code + " " + t.guests + " " + t.name).toLowerCase().includes(q));
      $("#tb").innerHTML = rows.map((t) => `<tr>
        <td><b>${esc(t.code)}</b></td><td class="guests">${esc(t.guests || t.name)}</td>
        <td>${t.qty} × ${esc(t.ticket_type)}</td>
        <td><span class="pill ${esc(t.status)}">${esc(t.status)}</span></td>
        <td>${t.checked_in ? `<span class="pill in">Entró ${fmt(t.checked_in)}</span> <button class="btn sm ghost" data-c="${esc(t.code)}" data-v="0">Deshacer</button>`
                            : `<button class="btn sm red" data-c="${esc(t.code)}" data-v="1">Marcar entrada</button>`}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">Nada que mostrar</td></tr>';
    };
    $("#q").oninput = draw; $("#onlyPaid").onchange = draw; draw();
    $("#tb").onclick = (e) => { const b = e.target.closest("[data-c]"); if (!b) return; b.textContent = "…"; act({ code: b.dataset.c, checked_in: b.dataset.v }); };
  }

  if (TAB === "subs") {
    v.innerHTML = `<div class="panel"><h2>Suscriptores (${subscribers.filter((s) => !s.unsubscribed).length} activos)</h2>
      <div class="tools"><button class="btn sm ghost" id="copy">Copiar correos</button><button class="btn sm ghost" id="exp">Exportar CSV</button></div>
      <div class="tbl"><table><thead><tr><th>Correo</th><th>Nombre</th><th>Fecha</th><th>Idioma</th><th>Estado</th></tr></thead><tbody>
      ${subscribers.slice().reverse().map((s) => `<tr><td>${esc(s.email)}</td><td>${esc(s.name)}</td><td>${fmt(s.created)}</td><td>${esc(s.lang)}</td><td>${s.unsubscribed ? '<span class="pill Cancelled">Dado de baja</span>' : '<span class="pill Paid">Activo</span>'}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">Sin suscriptores todavía</td></tr>'}
      </tbody></table></div></div>`;
    $("#exp").onclick = () => csv(subscribers, "rulitt-suscriptores.csv");
    $("#copy").onclick = () => { navigator.clipboard.writeText(subscribers.filter((s) => !s.unsubscribed).map((s) => s.email).join(", ")); $("#copy").textContent = "¡Copiados!"; };
  }

  if (TAB === "mail") {
    const active = subscribers.filter((s) => s.email && !s.unsubscribed);
    const camps = (DATA.campaigns || []).slice().reverse();
    v.innerHTML = `<div class="mail">
      <div class="panel"><h2>📣 Enviar flyer a suscriptores</h2>
        <p class="note" style="margin-bottom:12px">Se envía desde r.u.littentertainment@gmail.com a <b>${active.length}</b> suscriptores activos. Gmail permite unos <b>${DATA.quota ?? 100}</b> correos más hoy. Cada correo lleva su link para darse de baja.</p>
        <label class="field">Asunto<input class="in" id="mSub" placeholder="🎃 El Apagón — Early Bird $20 · Viernes 30 de octubre"></label>
        <label class="field">Imagen / flyer
          <input class="in" type="file" id="mFile" accept="image/*">
          <div class="chips"><button class="btn sm ghost" type="button" id="mApagon">Usar flyer de El Apagón</button><button class="btn sm ghost" type="button" id="mNoImg">Sin imagen</button></div></label>
        <label class="field">Mensaje<textarea class="in" id="mMsg" placeholder="Escribe el mensaje… (puedes usar inglés y español)"></textarea></label>
        <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:8px">
          <label class="field">Texto del botón<input class="in" id="mBtn" value="Get tickets"></label>
          <label class="field">Link del botón<input class="in" id="mUrl" value="https://rulittentertainment.com/tickets.html"></label>
        </div>
        <div class="tools" style="margin-top:6px">
          <input class="in" id="mTest" type="email" placeholder="Correo para prueba" style="max-width:240px">
          <button class="btn sm ghost" id="mSendTest">Enviar prueba</button>
          <button class="btn red" id="mSendAll">Enviar a ${active.length} suscriptores</button>
        </div>
        <p class="err" id="mMsgOut" style="color:#cfcfcf"></p>
      </div>
      <div class="panel"><h2>Vista previa</h2><div class="preview" id="mPrev"></div></div>
    </div>
    <div class="panel"><h2>Flyers enviados</h2><div class="tbl"><table><thead><tr><th>Fecha</th><th>Asunto</th><th>Enviados</th><th></th></tr></thead><tbody>
      ${camps.map((c) => `<tr><td>${fmt(c.created)}</td><td>${esc(c.subject)}</td><td>${c.sent}</td><td>${c.test ? '<span class="pill Pending">Prueba</span>' : ""}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">Todavía no se ha enviado ninguno</td></tr>'}
    </tbody></table></div></div>`;

    let img = "", imgData = "";
    const prev = () => {
      const msg = esc($("#mMsg").value).replace(/\n/g, "<br>"), btn = $("#mBtn").value, src = imgData || img;
      $("#mPrev").innerHTML = `<div style="max-width:520px;margin:0 auto;background:#0d0d0d;border:1px solid #222;border-radius:14px;overflow:hidden;font-family:Arial;color:#f5f5f5">
        <div style="text-align:center;padding:18px;font-size:24px;font-weight:800;letter-spacing:2px">R.U.LITT<div style="font-size:9px;letter-spacing:6px;color:#9a9a9a;font-weight:400">ENTERTAINMENT</div></div>
        ${src ? `<img src="${src}" style="display:block;width:100%">` : ""}
        <div style="padding:20px;font-size:14px;line-height:1.6;color:#e6e6e6">${msg || '<span style="color:#666">Tu mensaje aparece aquí…</span>'}</div>
        ${btn ? `<div style="text-align:center;padding:0 20px 24px"><span style="display:inline-block;background:#d0021b;color:#fff;font-weight:700;padding:12px 24px;border-radius:999px">${esc(btn)}</span></div>` : ""}
        <div style="text-align:center;padding:14px;border-top:1px solid #222;font-size:10px;color:#8a8a8a">R.U.LITT Entertainment · Idaho, USA · Unsubscribe / Darse de baja</div></div>`;
    };
    ["mMsg", "mBtn"].forEach((id) => ($("#" + id).oninput = prev));
    $("#mApagon").onclick = () => { img = "https://rulittentertainment.com/media/events/apagon.jpg"; imgData = ""; $("#mFile").value = ""; prev(); };
    $("#mNoImg").onclick = () => { img = ""; imgData = ""; $("#mFile").value = ""; prev(); };
    $("#mFile").onchange = () => {   // shrink to max 1200px JPEG in the browser
      const f = $("#mFile").files[0]; if (!f) return;
      const im = new Image(); im.onload = () => {
        const s = Math.min(1, 1200 / im.width), c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        imgData = c.toDataURL("image/jpeg", 0.82); img = ""; prev();
      }; im.src = URL.createObjectURL(f);
    };
    prev();

    const send = async (test) => {
      const out = $("#mMsgOut"), subject = $("#mSub").value.trim();
      if (!subject) { out.textContent = "Escribe el asunto."; return; }
      if (!$("#mMsg").value.trim()) { out.textContent = "Escribe el mensaje."; return; }
      if (test && !/@/.test(test)) { out.textContent = "Escribe un correo para la prueba."; return; }
      if (!test && !confirm(`¿Enviar este flyer a ${active.length} suscriptores? No se puede deshacer.`)) return;
      out.textContent = test ? "Enviando prueba…" : `Enviando a ${active.length}… (puede tardar un minuto)`;
      try {
        const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ kind: "campaign", key: KEY, subject, message: $("#mMsg").value, btnText: $("#mBtn").value.trim(), btnUrl: $("#mUrl").value.trim(), imageUrl: img, imageData: imgData, test: test || "" }) });
        const j = await r.json();
        if (!j.ok) { out.textContent = j.error === "quota" ? `Gmail solo permite ${j.quota} correos más hoy (necesitas ${j.needed}). Intenta mañana.` : "Error: " + j.error; return; }
        if (j.image && imgData) { img = j.image; imgData = ""; }   // reuse the uploaded image next time
        out.textContent = test ? `✅ Prueba enviada a ${test}. Revisa la bandeja (y Spam).` : `✅ Enviado a ${j.sent} suscriptores.`;
        if (!test) { await load(); render(); }
      } catch (err) { out.textContent = "No se pudo enviar. Revisa la conexión."; }
    };
    $("#mSendTest").onclick = () => send($("#mTest").value.trim());
    $("#mSendAll").onclick = () => send("");
  }

  if (TAB === "quotes") {
    v.innerHTML = `<div class="panel"><h2>Cotizaciones (${quotes.length})</h2><div class="cards">
      ${quotes.slice().reverse().map((q) => `<div class="q"><h3>${esc(q.name)} · ${esc(q.event_type)}</h3>
        <p><b>${esc(q.event_date)}</b> · ${esc(q.venue_city)} · ${esc(q.guest_count || "?")} invitados · ${esc(q.start_time)}–${esc(q.end_time)}</p>
        <p>${esc(q.email)} · ${esc(q.phone)}</p><p>Servicios: ${esc(q.services)}</p>${q.music ? `<p>Música: ${esc(q.music)}</p>` : ""}${q.message ? `<p>${esc(q.message)}</p>` : ""}
        <p><small>${fmt(q.created)}</small></p></div>`).join("") || '<p class="empty">Sin cotizaciones todavía</p>'}
      </div></div>`;
  }
}
</script>
</body>
</html>
